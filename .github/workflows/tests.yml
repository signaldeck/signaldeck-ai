name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "git+https://github.com/signaldeck/signaldeck-sdk.git@main"
      - run: python -m pip install "mcp>=1.30,<2" "uvicorn>=0.35,<1" "httpx>=0.27,<1" "flask>=3.0" "jsonschema>=4.26,<5" pytest
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q
